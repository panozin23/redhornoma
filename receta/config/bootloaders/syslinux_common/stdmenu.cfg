# stdmenu.cfg
# Copia del de live-build con las frases en ESPAÑOL.
#
# 🔴 POR QUÉ — 18/08/2026
#
# Este es el menú de las MÁQUINAS ANTIGUAS, que son las que de verdad hay
# en los centros. Salía en inglés: «Boot menu» y «Press ENTER to boot or
# TAB to edit a menu entry». Quien enciende esa computadora no tiene por
# qué saber qué le están diciendo.
#
# Se vio fotografiando el arranque del perfil «antigua». En el de las
# máquinas modernas estas frases no salen: son de otro programa de
# arranque, así que arreglar uno no arregla el otro.

menu background splash.png
menu color title	* #FFFFFFFF *
menu color border	* #00000000 #00000000 none
menu color sel		* #ffffffff #76a1d0ff *
menu color hotsel	1;7;37;40 #ffffffff #76a1d0ff *
menu color tabmsg	* #ffffffff #00000000 *
menu color help		37;40 #ffdddd00 #00000000 none
menu vshift 12
menu rows 10
menu helpmsgrow 15
# The command line must be at least one line from the bottom.
menu cmdlinerow 16
menu timeoutrow 16
menu tabmsgrow 18
menu tabmsg Pulsa INTRO para arrancar
