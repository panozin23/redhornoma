# menu.cfg
# Copia del de live-build con las frases en ESPAÑOL.
#
# 🔴 POR QUÉ — 18/08/2026
#
# Este es el menú de las MÁQUINAS ANTIGUAS, que son las que de verdad hay
# en los centros. Salía en inglés: «Boot menu» y «Press ENTER to boot or
# TAB to edit a menu entry». Quien enciende esa computadora no tiene por
# qué saber qué le están diciendo.
#
# Se vio fotografiando el arranque del perfil «antigua». En el de las
# máquinas modernas estas frases no salen: son de otro programa de
# arranque, así que arreglar uno no arregla el otro.

menu hshift 0
menu width 82

menu title Elige como arrancar
include stdmenu.cfg
include live.cfg
@OPTIONAL_INSTALLER_INCLUDE@
menu begin utilities
	menu label ^Herramientas
	menu title Herramientas
	include stdmenu.cfg
	label mainmenu
		menu label ^Volver..
		menu exit
	include utilities.cfg
menu end

menu clear
