# Que el menú de arranque enseñe también el Windows que ya estaba.
#
# RedHornoma se instala muchas veces en una computadora que YA tiene Windows,
# y a veces también un Linux anterior. Si al terminar el menú solo enseña
# RedHornoma, quien esté delante da por perdido su Windows. No lo está —sigue
# ahí, y el firmware aún lo arranca— pero eso no lo sabe nadie en ese momento.
#
# «os-prober» es quien lo busca, y viene en la receta desde el principio. Lo
# que faltaba es esto: Debian lo entrega DESACTIVADO desde grub 2.06, por una
# decisión de seguridad pensada para servidores, no para el portátil de un
# centro de salud.
#
# Se vio el 09/08/2026, antes de instalar en un portátil que ya tenía Windows
# y Ubuntu conviviendo.
#
# Va en grub.d y no en /etc/default/grub para no pelearse con el archivo del
# propio paquete de grub cuando se actualice.
GRUB_DISABLE_OS_PROBER=false

# Cinco segundos son pocos para leer un menú si es la primera vez y encima
# estás nervioso porque acabas de instalar.
GRUB_TIMEOUT=10
