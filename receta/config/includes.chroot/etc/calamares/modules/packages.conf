# Qué se quita del sistema al terminar de instalarlo.
#
# Los programas que hacen funcionar la sesión en vivo no sirven de nada en un
# equipo ya instalado, así que el instalador los quita al final.
#
# POR QUÉ ESTE ARCHIVO EXISTE
#
# El que trae Debian usa «remove» y da por hecho que la ISO se construyó con
# los metapaquetes live-task-*. RedHornoma declara sus paquetes uno a uno, así
# que esos dos no están. apt no encuentra lo que le mandan quitar, devuelve el
# código 100, y la instalación se para en el último paso con «hubo un error del
# gestor de paquetes» — después de haber copiado el sistema entero al disco.
#
# Pasó el 2026-08-02, instalando en un PC de escritorio de 2011.
#
# La diferencia está en «try_remove»: quita lo que encuentre y sigue adelante
# con lo que no. Así, si mañana la receta deja de declarar alguno de estos, la
# instalación no se rompe por eso.
#
# Es lo mismo que hace cursalialinux, que instala bien en todas las máquinas.

---
backend: apt

operations:
  - try_remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'calamares-settings-debian'
