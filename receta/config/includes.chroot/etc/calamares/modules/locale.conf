# Dónde está este país, para el instalador.
#
# POR QUÉ ESTE ARCHIVO EXISTE
#
# Debian NO trae ningún ajuste de idioma para Calamares: el paquete
# calamares-settings-debian tiene once archivos de configuración y ninguno
# es «locale.conf». Sin él, el instalador adivina la región —por internet
# si puede, y si no por lo que encuentre— y el 08/08/2026 se vio con los
# ojos que abría en «español de España».
#
# En un centro de salud de Bolivia eso no es un detalle de idioma: la zona
# horaria que elija el instalador es la que va a llevar CADA REGISTRO que
# se escriba después. Ya nos pasó dos veces con Windows —en Cochabamba el
# 05/08 y en Hornoma el 10/08, los dos en hora de México, dos horas atrás—
# y cerca de medianoche eso cambia el DÍA. En un cambio de mes, el registro
# entra en el concentrado equivocado: el que se entrega al SEDES.
#
# Nadie da ningún error por esto. Por eso se fija aquí y no se deja
# adivinar.

---
# La zona horaria que sale marcada de entrada. La persona puede cambiarla,
# pero lo normal —lo que hay que poner sin pensar— ya está puesto.
region:     "America"
zone:       "La_Paz"

# El idioma y los formatos de partida. «es_BO» es español de Bolivia:
# la fecha en día/mes/año y el punto decimal como se usa aquí.
localeGenPath: "/etc/locale.gen"
