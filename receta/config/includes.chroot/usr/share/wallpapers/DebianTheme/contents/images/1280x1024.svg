<?xml version="1.0" encoding="UTF-8"?>
<!--
  El fondo del escritorio de RedHornoma.

  EL PORQUÉ — 18/08/2026

  Traía el remolino de Debian. Se vio en una foto del escritorio de la
  ISO, no leyendo ningún archivo.

  CÓMO ESTÁ HECHO, para quien lo tenga que tocar

  Estos archivos pertenecen al paquete «desktop-base», y aquí se ponen
  ENCIMA de los suyos. Es lo que menos puede romperse: no toca ninguna
  configuración de KDE, y si algún día fallara, el escritorio se quedaría
  con el fondo de Debian y nada más.

  ⚠️  Contrapartida: si se actualiza «desktop-base» en un equipo ya
  instalado, Debian vuelve a poner el suyo. Se arregla volviendo a copiar
  estos archivos.

  Va a propósito muy sencillo: encima se ven los iconos del centro, y un
  fondo cargado los hace difíciles de leer. El nombre queda en una esquina,
  discreto.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"
     width="1280" height="1024" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%"   stop-color="#12303b"/>
      <stop offset="60%"  stop-color="#1c4b5a"/>
      <stop offset="100%" stop-color="#2e7d8f"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#g)"/>
  <!-- Una curva muy suave, para que no sea un plano liso. Con poca
       opacidad: tiene que notarse apenas. -->
  <path d="M0,760 C520,660 1140,900 1920,700 L1920,1080 L0,1080 Z"
        fill="#ffffff" opacity="0.045"/>
  <path d="M0,880 C620,800 1200,1000 1920,840 L1920,1080 L0,1080 Z"
        fill="#000000" opacity="0.07"/>
  <!-- 🔴 AQUÍ IBA EL NOMBRE, Y SE QUITÓ A PROPÓSITO.
       Estos fondos se recortan para llenar cada pantalla («slice»), y lo
       que se recorta depende de la forma de cada una: en una pantalla
       alta se van los lados, en una ancha se va arriba y abajo. Cualquier
       texto que no esté en el centro exacto desaparece en alguna pantalla.
       Se probó en 1280x1024 y el nombre no salía.
       Y en un escritorio de trabajo tampoco hace falta: el nombre ya está
       en el arranque y en el instalador. Aquí solo estorbaría a los
       iconos del centro. -->
</svg>
