<?xml version="1.0" encoding="UTF-8"?>
<!--
  «Las computadoras del centro».
  Misma familia que los otros iconos propios —cuadrado redondeado, dibujo
  blanco grueso— y otro color, para que en el menú se distingan de un
  vistazo sin tener que leer. Dos pantallas, que es lo que enseña.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect x="3" y="3" width="42" height="42" rx="11" fill="#2E86C1"/>
  <rect x="3" y="3" width="42" height="42" rx="11" fill="#ffffff" opacity="0.10"/>
  <rect x="3" y="24" width="42" height="21" rx="11" fill="#000000" opacity="0.07"/>
  <!-- la de atrás -->
  <rect x="19" y="10" width="21" height="15" rx="2.5" fill="#ffffff" opacity="0.55"/>
  <!-- la de delante, con su peana -->
  <rect x="8"  y="17" width="23" height="16" rx="2.5" fill="#ffffff"/>
  <rect x="16" y="33" width="7"  height="4"  fill="#ffffff"/>
  <rect x="12" y="36" width="15" height="2.6" rx="1.3" fill="#ffffff"/>
</svg>
