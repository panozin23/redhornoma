# Que actualizar no le haga preguntas a nadie.
#
# 🔴 El 15/08/2026, actualizando, a euflo le salió una pantalla azul en
# INGLÉS —«Which services should be restarted?»— con dieciocho servicios y
# casillas que marcar. Y preguntó, con razón: «salió eso, qué hago».
#
# En un centro de salud eso es una actualización que se queda parada. No
# hay quien sepa qué es «polkit» ni cuál conviene reiniciar, y la respuesta
# correcta —aceptar lo que ya viene marcado— no se adivina. Peor aún: si
# nadie contesta, la actualización espera para siempre.
#
# Con esto, needrestart reinicia solo lo que hay que reiniciar y no
# pregunta. Es lo mismo que ya elegía la pantalla por defecto, sin la
# pantalla: los servicios delicados —libvirtd, NetworkManager, sddm— tienen
# su propia lista de excepciones y siguen sin tocarse, así que no se corta
# ni la sesión ni la máquina virtual.
$nrconf{restart} = 'a';

# Y tampoco la lista de «hay que reiniciar el equipo». Cuando haga falta,
# lo dice el panel, en español y cuando toque.
$nrconf{kernelhints} = 0;
